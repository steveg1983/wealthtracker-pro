# Desktop installers — macOS (.dmg, both architectures) and Windows (.exe).
#
# WHY A WORKFLOW AND NOT A CROSS-COMPILE: Windows bundling (NSIS) runs only on
# Windows, and a .dmg is only honest when it came from a macOS toolchain. The
# per-platform runner IS the build machine, exactly as it is for the nightly
# desktop build.
#
# WHY NOT ON EVERY PR: one release build costs ~262 CPU-seconds per platform
# (454 crates). The per-PR desktop-renderer job already proves the renderer
# builds, is cloud-free and fits the ratchet; THIS workflow exists to produce
# artefacts somebody will download, so it runs when a release is asked for:
# a `desktop-v*` tag, or the Run-workflow button.
#
# SIGNING — THREE SIGNATURES, ANSWERING THREE DIFFERENT QUESTIONS:
#
#   1. UPDATE signing (since 0.1.1). Every updater archive is signed with the
#      release keypair, and the installed app verifies it against the public
#      half in tauri.conf.json. Stops a hostile endpoint serving a payload
#      that runs. Nothing to do with Apple.
#
#   2. macOS CODE signing (APPLE_CERTIFICATE). Without it the binary is
#      unsigned — and an unsigned binary CANNOT BE NOTARISED. Measured on
#      0.1.1: Apple refused it for "the binary is not signed", no secure
#      timestamp and no hardened runtime, which is why 0.1.1 and 0.1.2 both had
#      to be rebuilt by hand on the owner's Mac.
#
#   3. NOTARISATION (APPLE_API_*). Apple's opinion that the signed thing is not
#      malware. An App Store Connect key rather than an app-specific password,
#      because the same key also uploads the iOS build.
#
# WINDOWS code signing is still absent, so the .exe shows SmartScreen's "more
# info" on first run. That needs a separate certificate from a commercial CA.
#
# Each of the three degrades quietly when its secret is missing — an unsigned
# build, or a signed one that is not notarised — so this file works before the
# secrets exist and keeps working if one is rotated away. It never claims
# otherwise: the collect step publishes whatever was actually produced.
#
# The repo is PUBLIC: certificates, passwords and keys live in Actions
# secrets, never in this file.
name: Desktop installers

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

permissions:
  contents: write # release upload on tag builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal .dmg rather than two single-arch ones. The first run
          # tried `macos-13` for Intel and the job sat queued for 40 minutes
          # while both siblings finished — that runner label is retired, and a
          # retired label queues forever instead of failing. An arm64 runner
          # cross-compiles x86_64 fine (same OS, second rustup target), and
          # `universal-apple-darwin` lipos the two into the one artefact Mac
          # users expect anyway. The renderer is arch-neutral; only the ~16 MB
          # binary doubles.
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            artifact: macos-universal
          - os: windows-latest
            bundles: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal build needs both halves; harmless elsewhere.
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates

      # The web install: vite and the renderer's dependencies. The desktop
      # CLI is a separate install on purpose — the web package.json carries
      # no desktop dependencies (apps/desktop/README.md).
      - run: npm ci
      - run: npm ci --prefix apps/desktop

      - name: Build the renderer
        run: npm run desktop:ui

      # The same three gates the per-PR job runs, so an installer can never
      # be built from a renderer that would have failed the PR.
      - name: Cloud-free greps and size ratchet
        run: |
          npm run desktop:greps
          npm run bundle:check:desktop
        shell: bash

      # The App Store Connect key, written to a file because that is the only
      # form the bundler accepts (APPLE_API_KEY_PATH). Runner-local, and the
      # runner is destroyed with the job.
      - name: Provide the App Store Connect key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # The absence check is in the SCRIPT, not in an `if:`. The secrets
          # context is not dependable in a step condition, and a workflow that
          # silently stopped running this step would produce an unsigned build
          # while looking exactly like a signed one.
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "No APPLE_API_KEY_P8 configured — this build will not be notarised."
            exit 0
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "App Store Connect key staged."

      - name: Build the installer
        # THREE DIFFERENT SIGNATURES MEET HERE, and they answer different
        # questions. Keeping them straight is most of the difficulty:
        #
        #  TAURI_SIGNING_*   the UPDATE signature. The installed app verifies
        #                    every downloaded archive against the public half
        #                    in tauri.conf.json, so a compromised endpoint
        #                    cannot serve a payload that runs. Nothing to do
        #                    with Apple.
        #  APPLE_CERTIFICATE the OS signature. Without it the binary is
        #                    unsigned, and an unsigned binary CANNOT BE
        #                    NOTARISED — Apple rejects it outright for "the
        #                    binary is not signed", no secure timestamp and no
        #                    hardened runtime. Measured on 0.1.1, which is why
        #                    both 0.1.1 and 0.1.2 had to be rebuilt by hand on
        #                    the owner's Mac and notarised there.
        #  APPLE_API_*       notarisation itself: Apple's opinion that the
        #                    signed thing is not malware. The same key also
        #                    uploads the iOS build, which is why it is a key
        #                    rather than an app-specific password.
        #
        # Every one of them degrades quietly when its secret is absent — an
        # unsigned build, or a signed one that is not notarised — so this file
        # keeps working before the secrets exist. What it must never do is
        # claim otherwise, and it does not: the collect step publishes whatever
        # was actually produced.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: npm run --prefix apps/desktop tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p out
          # A --target build lands under target/<triple>/release; find covers both.
          BUNDLE_DIR="apps/desktop/src-tauri/target"
          # What a person downloads.
          find "$BUNDLE_DIR" -name '*.dmg' -exec cp {} out/ \; 2>/dev/null || true
          find "$BUNDLE_DIR" -name '*-setup.exe' -exec cp {} out/ \; 2>/dev/null || true
          # What an INSTALLED app downloads, and the two platforms do NOT
          # agree on its shape:
          #
          #   macOS   a SEPARATE archive, WealthTracker.app.tar.gz, beside the
          #           .dmg a person downloads;
          #   Windows the SAME -setup.exe a person downloads, with a .sig next
          #           to it. (Tauri v1 produced a -setup.nsis.zip here and v2
          #           does not — measured on the 0.1.1 build, where asking for
          #           the v1 name found nothing and the manifest job below
          #           correctly refused to publish half a manifest.)
          find "$BUNDLE_DIR" -name '*.app.tar.gz' -exec cp {} out/ \; 2>/dev/null || true
          find "$BUNDLE_DIR" -name '*.app.tar.gz.sig' -exec cp {} out/ \; 2>/dev/null || true
          find "$BUNDLE_DIR" -name '*-setup.exe.sig' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: wealthtracker-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

      # On a tag build, the artefacts also land on a GitHub release, which is
      # the download page until there is a better one.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: true

  # ─────────────────────────────────────────────────────────────────────────
  # The manifest an INSTALLED app reads.
  #
  # It has to be its own job because it is the one artefact that needs BOTH
  # platforms' output at once: one file naming the macOS archive and the
  # Windows archive with their signatures. `needs: build` is that barrier.
  #
  # WHERE THE APP LOOKS: tauri.conf.json points at
  # `releases/latest/download/latest.json`, and GitHub resolves "latest" to the
  # newest PUBLISHED, non-draft release. The release this workflow creates is a
  # DRAFT — so nothing is offered to anyone until the draft is published by
  # hand. That is the intended safety catch: publishing the release IS the act
  # of shipping the update, and it happens after the .dmg has been notarised
  # and swapped in.
  # ─────────────────────────────────────────────────────────────────────────
  manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Compose latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          # A missing half is a HARD failure. The alternative — emitting a
          # manifest naming only the platform that built — would tell every
          # user of the other platform that they are up to date when they are
          # not, which is worse than no manifest at all.
          need() {
            local found
            found="$(find artefacts -name "$1" -print -quit)"
            if [ -z "$found" ]; then
              echo "desktop-release: no artefact matching '$1' — refusing to publish a partial manifest" >&2
              exit 1
            fi
            printf '%s' "$found"
          }

          MAC_ARCHIVE="$(need '*.app.tar.gz')"
          MAC_SIGNATURE="$(cat "$(need '*.app.tar.gz.sig')")"
          # Windows updates FROM the installer itself — see the collect step.
          WIN_ARCHIVE="$(need '*-setup.exe')"
          WIN_SIGNATURE="$(cat "$(need '*-setup.exe.sig')")"

          # The macOS build is universal, so both Apple architectures are
          # served the one archive — that is what `universal-apple-darwin`
          # buys, and the updater still has to be told twice because it keys
          # on the running architecture.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$BASE/$(basename "$MAC_ARCHIVE")" \
            --arg mac_sig "$MAC_SIGNATURE" \
            --arg win_url "$BASE/$(basename "$WIN_ARCHIVE")" \
            --arg win_sig "$WIN_SIGNATURE" \
            '{
              version: $version,
              pub_date: $pub_date,
              notes: "See the release notes on GitHub.",
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64":  { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json

          echo "--- latest.json (signatures elided) ---"
          jq '.platforms |= map_values(.signature = "<signed>")' latest.json

      - name: Attach the manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          draft: true
