<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WealthTracker</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 .5rem; overflow-wrap: anywhere; }
      p { margin: 0 0 1.5rem; line-height: 1.5; opacity: .85; }
      button { font: inherit; padding: .6rem 1.1rem; margin-right: .5rem; border-radius: .5rem; border: 1px solid currentColor; background: transparent; cursor: pointer; }
      button:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div id="shell">
        <h1>WealthTracker</h1>
        <p>No ledger is open. Open one, or make a new one — it is a single file, and it stays on this machine.</p>
      </div>
      <button id="open" type="button">Open a ledger…</button>
      <button id="create" type="button">New ledger…</button>
    </main>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
