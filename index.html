<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores the manifest's icons and reads this tag alone. Without it
         a home-screen install uses a SCREENSHOT of the page as the app icon,
         which is the first thing anyone sees and says "website" immediately. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Launch without Safari chrome, and let content run under the status bar
         so the app's own slate meets the top of the screen rather than a white
         band. Pairs with viewport-fit=cover below and the safe-area insets in
         index.css — translucent means WE owe the padding. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WealthTracker" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2332" />
    <meta name="description" content="A personal finance ledger built on agreement, not estimation. Every figure traces to a line you entered and reconciled. Imports Microsoft Money." />
    <title>WealthTracker — a ledger you can prove</title>
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://nqbacrjjgdjabygqtcah.supabase.co" crossorigin>

    <!-- Inter and IBM Plex Mono, SELF-HOSTED (30 Aug 2026). The old Google
         Fonts stylesheet sent every visitor's IP and user agent to Google on
         every page load, before any consent choice — and Google appeared in
         no processor list because it was never meant to be one. The woff2
         subsets below are the same files Google served, now from this origin;
         the @font-face rules live in the critical style block. Preload note:
         font preloads require crossorigin even same-origin, or the browser
         fetches the file twice. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="dns-prefetch" href="https://js.stripe.com">
    <link rel="dns-prefetch" href="https://browser.sentry-cdn.com">
    
    <!-- Critical CSS for faster initial render -->
    <style>
      /* Critical CSS inline - optimized for LCP */
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
      /* The ground and colour-scheme must exist BEFORE the async stylesheet
         arrives, or a dark-mode launch flashes white: index.css carries the
         real backgrounds but is ~375KB gzipped and loads after first paint.
         This block can only follow the system scheme — the app's own choice
         (html.dark) is applied by JS later and index.css wins from there.
         What this does NOT fix, verified 31 Aug 2026 by A/B in the iOS 26
         simulator against production: the light status-bar band on a
         home-screen web app in dark mode. That is Apple's wrapper bug
         (reversed appearance — see tutao/tutanota#8911; iOS 26.1 also stopped
         rendering web apps full-screen), and no page CSS, theme-color,
         color-scheme or manifest value reaches it. Do not re-attempt from
         here. */
      html{background-color:#f8f9fb;color-scheme:light}
      @media(prefers-color-scheme:dark){html{background-color:#111827;color-scheme:dark}}
      body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.5}
      #root{min-height:100vh;isolation:isolate}
      .app-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f3f4f6}
      .app-loading-caption{margin-top:16px;color:#1a2332;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:-0.01em}
      /* Prevent layout shift */
      img,video,canvas,svg{display:block;max-width:100%}
      input,button,textarea,select{font:inherit}
      /* Accessibility preserved */
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}
      /* Loading spinner animation */
      @keyframes spin{to{transform:rotate(360deg)}}
      .spinner{width:48px;height:48px;border:3px solid #e2e6ed;border-top-color:#1a2332;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
      /* After the light rules they override — same specificity, cascade order decides. */
      @media(prefers-color-scheme:dark){.app-loading{background:#111827}.app-loading-caption{color:#e5e7eb}.spinner{border-color:#374151;border-top-color:#e5e7eb}}
      /* Checkbox/radio exempt: index.css draws them 24px with a 10px margin, which IS the 44px target without drawing a 44px control. min-height clamps, so a bare `input` here made every checkbox a large empty square on a phone. FOURTH copy of this rule (index.css, AccessibilityImprovements.tsx, this one) — the duplication is why the exemption kept being missed. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/plex-mono-latin-400.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/plex-mono-latin-500.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/plex-mono-latin-ext-400.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/plex-mono-latin-ext-500.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @media(max-width:768px){body{font-size:16px}button:not(.toggle-switch),a,input:not([type="checkbox"]):not([type="radio"]),select,textarea{min-height:44px;touch-action:manipulation}}
    </style>
    
  </head>
  <body>
    <div id="root">
      <!-- Loading state while JS loads -->
      <div class="app-loading">
        <div style="text-align:center">
          <!-- Classes, not inline styles: the dark-scheme overrides above
               cannot beat a style attribute. -->
          <div class="spinner"></div>
          <p class="app-loading-caption">Loading WealthTracker...</p>
        </div>
      </div>
    </div>
    
    <!-- Add loading animation -->
    <style>
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    
    <script type="module" src="/src/main.tsx"></script>
    <!-- No inline scripts: CSP script-src has no 'unsafe-inline'.
         The reduced-motion check lives in src/main.tsx. -->
  </body>
</html>
